id: fac-banca-sintetica
name: fac-banca-sintetica
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - http://127.0.0.1:5173
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
# Sustituye los marcadores por los IDs de tu Warehouse (ver README, «Conectar un Warehouse o un endpoint SQL propio»).
connectors:
  - name: fac_wh_gold
    type: fabric-warehouse
    config:
      workspaceId: <id-del-workspace>
      itemId: <id-del-warehouse>
    auth:
      type: delegated
    operations:
      - name: read



