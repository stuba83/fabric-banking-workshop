[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fac_utils"
dynamic = ["version"]
description = "Funciones utilitarias de demostración para el taller de Microsoft Fabric (datos sintéticos)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fac_utils.funciones.__version__" }